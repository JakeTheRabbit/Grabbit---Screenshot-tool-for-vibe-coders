<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Grabbit scroll test</title>
<style>
  body { margin: 0; font: 20px/1.4 Segoe UI, sans-serif; background: #fff; }
  header { position: sticky; top: 0; background: #1f3a93; color: #fff; padding: 14px 20px; font-weight: 700; }
  .row { display: flex; gap: 16px; align-items: center; padding: 10px 20px; border-bottom: 1px solid #e5e5e5; }
  .row b { width: 90px; }
  .row span { flex: 1; color: #555; }
  .row i { width: 36px; height: 20px; border-radius: 4px; }
</style>
</head>
<body>
<header>Sticky header — Grabbit scroll test</header>
<main id="m"></main>
<script>
  const m = document.getElementById("m");
  for (let i = 1; i <= 120; i++) {
    const d = document.createElement("div");
    d.className = "row";
    d.innerHTML = `<b>Row ${i}</b><span>The quick brown fox ${"jumps over the lazy dog ".repeat(1 + (i % 3))}</span><i style="background:hsl(${i * 37 % 360} 70% 55%)"></i>`;
    m.append(d);
  }
</script>
</body>
</html>
