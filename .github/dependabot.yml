version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: monthly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: bun
    directory: /app
    schedule:
      interval: monthly
    groups:
      js:
        update-types: [minor, patch]
