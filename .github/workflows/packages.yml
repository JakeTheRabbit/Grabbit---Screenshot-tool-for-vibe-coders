name: Package managers

# When a release is published, point the Scoop bucket (bucket/grabbit.json) and the Homebrew tap (Casks/grabbit.rb),
# both kept in this repository, at its installers, then submit it to winget if a token is set.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.17)"
        required: true

permissions:
  contents: write

jobs:
  manifests:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Point latest.json at the normal download links
        run: python3 packaging/fix-latest-json.py "$REPO" "$TAG"
      - name: Write the Scoop and Homebrew manifests
        run: |
          V="${TAG#v}"
          mkdir -p dl bucket Casks
          gh release download "$TAG" -R "$REPO" -D dl -p "*_x64_en-US.msi" -p "*_aarch64.dmg" -p "*_x64.dmg"
          MSI=$(ls dl/*_x64_en-US.msi); ARM=$(ls dl/*_aarch64.dmg); X64=$(ls dl/*_x64.dmg)
          sha() { sha256sum "$1" | cut -d' ' -f1; }
          URL="https://github.com/$REPO/releases/download/$TAG"
          sed -e "s|@V@|$V|g" -e "s|@URL@|$URL/$(basename "$MSI")|g" -e "s|@SHA@|$(sha "$MSI")|g" packaging/scoop.json > bucket/grabbit.json
          sed -e "s|@V@|$V|g" -e "s|@REPO@|$REPO|g" -e "s|@SHA_ARM@|$(sha "$ARM")|g" -e "s|@SHA_X64@|$(sha "$X64")|g" packaging/cask.rb > Casks/grabbit.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket Casks
          git diff --cached --quiet || { git commit -m "Scoop and Homebrew: Grabbit $V"; git push; }

  aur:
    # Arch, Manjaro, EndeavourOS, Omarchy (x86_64 and aarch64, e.g. Apple silicon on Asahi): yay -S grabbit-bin
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Write the PKGBUILD and .SRCINFO
        run: |
          bash packaging/aur/render.sh "$REPO" "$TAG" aur-out
          docker run --rm -v "$PWD/aur-out:/p" archlinux:latest bash -c 'useradd -m b && chown -R b /p && cd /p && su b -c "makepkg --printsrcinfo > .SRCINFO"'
          cat aur-out/.SRCINFO
      - uses: actions/upload-artifact@v7
        with:
          name: aur-grabbit-bin
          path: aur-out/
          include-hidden-files: true
      # Skipped until the AUR_SSH_KEY secret is set (the private half of a key added to the AUR account).
      - name: Publish to the AUR
        if: env.AUR_SSH_KEY != ''
        continue-on-error: true
        run: |
          mkdir -p ~/.ssh && echo "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/grabbit-bin.git aur-repo
          cp aur-out/PKGBUILD aur-out/.SRCINFO aur-repo/
          cd aur-repo
          git config user.name JakeTheRabbit
          git config user.email "123831499+JakeTheRabbit@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || { git commit -m "grabbit-bin ${TAG#v}"; git push origin HEAD:master; }

  winget:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      # Fails until the first listing is approved in winget-pkgs; that's not a broken release.
      - name: Update the winget package
        if: env.WINGET_TOKEN != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart("v")
          $url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/Grabbit_${v}_x64-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          .\wingetcreate.exe update JakeTheRabbit.Grabbit --version $v --urls $url --submit --token $env:WINGET_TOKEN
